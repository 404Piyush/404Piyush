name: Generate contribution grid snake

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: 404Piyush
          outputs: |
            dist/github-contribution-grid-snake-dark.svg
            dist/github-contribution-grid-snake-dark.gif
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake.gif

      - name: Deploy snake to output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Save the generated dist files
          mkdir -p /tmp/snake-out
          cp -r dist/* /tmp/snake-out/

          # Switch to (or create) the output branch
          git checkout --orphan output 2>/dev/null || git checkout output
          git rm -rf . 2>/dev/null || true

          # Copy generated files in
          cp -r /tmp/snake-out/* .

          git add .
          if git diff --staged --quiet; then
            echo "No snake updates to publish"
            exit 0
          fi
          git commit -m "chore: regenerate contribution snake 🐍"
          git push origin output --force
