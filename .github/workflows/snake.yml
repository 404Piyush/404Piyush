name: Generate contribution grid snake

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: 404Piyush
          outputs: |
            dist/github-contribution-grid-snake-dark.svg
            dist/github-contribution-grid-snake-dark.gif
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake.gif
          commit_message: "chore: regenerate contribution snake 🐍"
